name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      # Testcontainers starts PostgreSQL from the runner's Docker.
      - run: mvn -B verify
      - run: docker build -t cuentas-api .
