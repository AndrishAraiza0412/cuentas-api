# Local stack: the API on 127.0.0.1:8080 and its PostgreSQL (not published outside the compose network).
# Copy .env.example to .env and fill it in first; the three secrets below have no defaults on purpose.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cuentas
      POSTGRES_USER: cuentas
      POSTGRES_PASSWORD: cuentas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas -d cuentas"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cuentas
      DATABASE_USER: cuentas
      DATABASE_PASSWORD: cuentas
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:?set OPERATOR_EMAIL in .env}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?set OPERATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
